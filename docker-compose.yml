# Local development: just the Postgres database.
# The full production stack (app + Postgres + Caddy + cron) is added in Phase 5.
services:
  db:
    image: postgres:16-alpine
    container_name: bubbly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bubbly
      POSTGRES_PASSWORD: bubbly
      POSTGRES_DB: bubbly
    ports:
      - "5432:5432"
    volumes:
      - bubbly-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bubbly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bubbly-db-data:
